<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimic Party - เกมเลียนแบบเสียง</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2d3436;
        }

        .container {
            width: 100%;
            max-width: 750px;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: all 0.3s ease;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .screen.active {
            display: flex;
        }

        h1 {
            font-size: 2.8rem;
            margin: 0 0 10px 0;
            background: linear-gradient(45deg, #6c5ce7, #ff7675);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #636e72;
            margin-bottom: 25px;
        }

        .form-group {
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-weight: 600;
            color: #2d3436;
            display: block;
            margin-bottom: 8px;
        }

        input[type="number"], select {
            width: 100%;
            padding: 14px 20px;
            font-size: 1.1rem;
            border-radius: 14px;
            border: 2px solid #dfe6e9;
            outline: none;
            transition: 0.2s;
            background: #f8f9fa;
        }

        input[type="number"]:focus, select:focus, .name-input:focus {
            border-color: #6c5ce7;
            background: #fff;
        }

        .names-container {
            width: 100%;
            max-width: 400px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 5px;
        }

        .name-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border-radius: 12px;
            border: 2px solid #dfe6e9;
            margin-bottom: 10px;
            outline: none;
            background: #f8f9fa;
        }

        .btn-primary {
            background: linear-gradient(45deg, #6c5ce7, #a29bfe);
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 1.3rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3);
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(108, 92, 231, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Status & Game UI */
        .player-badge {
            background: #e17055;
            color: white;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: inline-block;
        }

        .game-status-title {
            font-size: 2rem;
            font-weight: 700;
            margin: 5px 0;
            color: #2d3436;
        }

        /* Visualizer Canvas */
        .visualizer-box {
            position: relative;
            width: 100%;
            max-width: 550px;
            height: 140px;
            background: #f1f2f6;
            border-radius: 20px;
            margin: 20px 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #dfe6e9;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        /* Countdown Overlay */
        .countdown-overlay {
            position: absolute;
            font-size: 4.5rem;
            font-weight: 700;
            color: #6c5ce7;
            text-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: none;
        }

        /* Progress Bar Timer */
        .timer-bar-container {
            width: 100%;
            max-width: 550px;
            height: 12px;
            background: #dfe6e9;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .timer-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff7675, #d63031);
            transition: width 0.1s linear;
        }

        /* Score Display */
        .score-box {
            display: none;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .score-number {
            font-size: 4rem;
            font-weight: 700;
            color: #00b894;
            margin: 10px 0;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .hint-text {
            font-size: 1.1rem;
            color: #0984e3;
            font-weight: 600;
            background: #e8f4fd;
            padding: 10px 25px;
            border-radius: 30px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.7; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.7; transform: scale(0.98); }
        }

        /* Podium / Leaderboard */
        .podium-wrapper {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 15px;
            margin: 30px 0 20px 0;
            width: 100%;
            height: 260px;
        }

        .podium-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 15px;
            width: 120px;
            border-radius: 20px 20px 10px 10px;
            color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            position: relative;
        }

        .podium-1 { height: 100%; background: linear-gradient(180deg, #fdcb6e, #e17055); order: 2; }
        .podium-2 { height: 80%; background: linear-gradient(180deg, #81ecec, #0984e3); order: 1; }
        .podium-3 { height: 65%; background: linear-gradient(180deg, #fab1a0, #ff7675); order: 3; }

        .podium-rank {
            font-size: 1.8rem;
            font-weight: 700;
            background: rgba(255,255,255,0.3);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .podium-name {
            font-size: 1.1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100px;
        }

        .podium-score {
            font-size: 1rem;
            opacity: 0.9;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            
            <!-- SCREEN 1: SETTINGS -->
            <div id="screen-setup" class="screen active">
                <h1>MIMIC PARTY 🎤</h1>
                <p class="subtitle">ปาร์ตี้ประชันเสียงเลียนแบบ ใครเป๊ะสุดชนะ!</p>

                <div class="form-group">
                    <label>จำนวนผู้เล่น (2 - 8 คน)</label>
                    <input type="number" id="player-count" min="2" max="8" value="3" onchange="generateNameInputs()">
                </div>

                <div class="form-group">
                    <label>ระยะเวลาอัดเสียงต่อรอบ</label>
                    <select id="record-duration">
                        <option value="3">3 วินาที (กำลังดี)</option>
                        <option value="4">4 วินาที</option>
                        <option value="5">5 วินาที</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>ชื่อผู้เล่น</label>
                    <div id="names-container" class="names-container"></div>
                </div>

                <button class="btn-primary" onclick="initGame()">เข้าสู่เกม</button>
            </div>

            <!-- SCREEN 2: GAMEPLAY -->
            <div id="screen-game" class="screen">
                <div id="player-badge" class="player-badge">ต้นฉบับ</div>
                <div id="game-status-title" class="game-status-title">ผู้เล่น 1</div>
                <p id="game-subtitle" class="subtitle" style="margin-bottom: 10px;">เตรียมสร้างเสียงต้นฉบับ</p>

                <div class="visualizer-box">
                    <div id="countdown-overlay" class="countdown-overlay">3</div>
                    <canvas id="visualizer"></canvas>
                </div>

                <div class="timer-bar-container">
                    <div id="timer-bar" class="timer-bar"></div>
                </div>

                <div id="score-box" class="score-box">
                    <div style="font-size: 1.1rem; color: #636e72;">ความเหมือน</div>
                    <div id="score-number" class="score-number">0%</div>
                </div>

                <div id="hint-text" class="hint-text">กด [ Spacebar ] เพื่อเริ่มนับถอยหลัง</div>
            </div>

            <!-- SCREEN 3: PODIUM RESULT -->
            <div id="screen-result" class="screen">
                <h1>🏆 ผลการแข่งขัน 🏆</h1>
                <p class="subtitle">อันดับเสียงเลียนแบบเป๊ะที่สุด!</p>

                <div class="podium-wrapper" id="podium-wrapper"></div>

                <button class="btn-primary" onclick="location.reload()">เล่นใหม่อีกครั้ง</button>
            </div>

        </div>
    </div>

    <script>
        // Game Configuration & State
        let playerNames = [];
        let recordDuration = 3; // Seconds
        let currentStep = 'TARGET_READY'; // TARGET_READY, RECORDING, PLAYING, PLAYER_READY, SHOW_SCORE
        let targetPlayerIndex = 0;
        let currentPlayerIndex = 1;
        
        let targetAudioFeatures = [];
        let targetAudioBlob = null;
        let currentPlayerFeatures = [];
        let playerScores = []; // { name, score }

        // Audio Context & Processors
        let audioCtx, analyser, microphone, mediaRecorder;
        let audioChunks = [];
        let isAnalysing = false;
        let currentFeaturesTemp = [];

        // DOM Elements
        const elSetup = document.getElementById('screen-setup');
        const elGame = document.getElementById('screen-game');
        const elResult = document.getElementById('screen-result');
        const elNamesContainer = document.getElementById('names-container');
        const elPlayerBadge = document.getElementById('player-badge');
        const elStatusTitle = document.getElementById('game-status-title');
        const elSubtitle = document.getElementById('game-subtitle');
        const elCountdown = document.getElementById('countdown-overlay');
        const elTimerBar = document.getElementById('timer-bar');
        const elScoreBox = document.getElementById('score-box');
        const elScoreNumber = document.getElementById('score-number');
        const elHint = document.getElementById('hint-text');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');

        // Setup Name Input Fields Dynamically
        function generateNameInputs() {
            const count = parseInt(document.getElementById('player-count').value) || 2;
            elNamesContainer.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'name-input';
                input.placeholder = `ชื่อผู้เล่นคนที่ ${i}`;
                input.value = `ผู้เล่น ${i}`;
                elNamesContainer.appendChild(input);
            }
        }
        generateNameInputs();

        // Initialize Audio System
        async function initGame() {
            const inputs = document.querySelectorAll('.name-input');
            playerNames = Array.from(inputs).map((input, idx) => input.value.trim() || `ผู้เล่น ${idx + 1}`);
            recordDuration = parseInt(document.getElementById('record-duration').value);

            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 512;
                
                microphone = audioCtx.createMediaStreamSource(stream);
                microphone.connect(analyser);

                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

                elSetup.classList.remove('active');
                elGame.classList.add('active');

                setupTurnTarget();
                drawVisualizer();
            } catch (err) {
                alert('กรุณาอนุญาตการใช้งานไมโครโฟนเพื่อเริ่มเล่นเกมครับ');
                console.error(err);
            }
        }

        // Global Spacebar Key Listener
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && elGame.classList.contains('active')) {
                e.preventDefault();
                handleSpacebar();
            }
        });

        function handleSpacebar() {
            if (currentStep === 'TARGET_READY') {
                startCountdownAndRecord(true);
            } else if (currentStep === 'PLAYER_READY') {
                startCountdownAndRecord(false);
            } else if (currentStep === 'SHOW_SCORE') {
                nextPlayerTurn();
            }
        }

        // Setup Turns
        function setupTurnTarget() {
            currentStep = 'TARGET_READY';
            elPlayerBadge.innerText = "ต้นฉบับ";
            elPlayerBadge.style.background = "#e17055";
            elStatusTitle.innerText = playerNames[0];
            elSubtitle.innerText = "พูดสร้างเสียงต้นฉบับให้เพื่อนๆ เลียนแบบ";
            elScoreBox.style.display = 'none';
            elHint.style.display = 'block';
            elHint.innerText = "กด [ Spacebar ] เพื่อเริ่มนับถอยหลัง";
        }

        function setupTurnPlayer() {
            currentStep = 'PLAYER_READY';
            elPlayerBadge.innerText = `ผู้เลียนแบบ (${currentPlayerIndex}/${playerNames.length - 1})`;
            elPlayerBadge.style.background = "#6c5ce7";
            elStatusTitle.innerText = playerNames[currentPlayerIndex];
            elSubtitle.innerText = "ฟังเสียงต้นฉบับแล้วเตรียมเลียนแบบให้เป๊ะ!";
            elScoreBox.style.display = 'none';
            elHint.style.display = 'block';
            elHint.innerText = "กด [ Spacebar ] เพื่อฟังต้นฉบับและเริ่มทำตาม";
        }

        // Countdown & Auto Record Timer
        function startCountdownAndRecord(isTarget) {
            currentStep = 'RECORDING';
            elHint.style.display = 'none';

            // Play target sound first if it's player's turn
            if (!isTarget && targetAudioBlob) {
                playAudioBlob(targetAudioBlob, () => runCountdown(isTarget));
            } else {
                runCountdown(isTarget);
            }
        }

        function runCountdown(isTarget) {
            let count = 3;
            elCountdown.style.display = 'block';
            elCountdown.innerText = count;

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    elCountdown.innerText = count;
                } else {
                    clearInterval(interval);
                    elCountdown.style.display = 'none';
                    executeRecording(isTarget);
                }
            }, 800);
        }

        function executeRecording(isTarget) {
            audioChunks = [];
            currentFeaturesTemp = [];
            isAnalysing = true;
            mediaRecorder.start();

            // Animate Timer Bar
            elTimerBar.style.width = '100%';
            elTimerBar.style.transition = `width ${recordDuration}s linear`;
            
            setTimeout(() => {
                elTimerBar.style.width = '0%';
            }, 50);

            // Record duration timeout
            setTimeout(() => {
                mediaRecorder.stop();
                isAnalysing = false;
                elTimerBar.style.transition = 'none';

                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    if (isTarget) {
                        targetAudioBlob = blob;
                        targetAudioFeatures = [...currentFeaturesTemp];
                        
                        // Target finished, move to first player
                        playAudioBlob(targetAudioBlob, () => {
                            currentPlayerIndex = 1;
                            setupTurnPlayer();
                        });
                    } else {
                        currentPlayerFeatures = [...currentFeaturesTemp];
                        const score = calculateAudioSimilarity(targetAudioFeatures, currentPlayerFeatures);
                        
                        playerScores.push({
                            name: playerNames[currentPlayerIndex],
                            score: score
                        });

                        // Show Score & Play recorded sound
                        elScoreBox.style.display = 'block';
                        elScoreNumber.innerText = score.toFixed(1) + "%";
                        
                        playAudioBlob(blob, () => {
                            currentStep = 'SHOW_SCORE';
                            elHint.style.display = 'block';
                            elHint.innerText = currentPlayerIndex < playerNames.length - 1 
                                ? "กด [ Spacebar ] เพื่อเปลี่ยนเป็นคนถัดไป" 
                                : "กด [ Spacebar ] เพื่อดูสรุปอันดับผลลัพธ์!";
                        });
                    }
                };
            }, recordDuration * 1000);
        }

        function nextPlayerTurn() {
            currentPlayerIndex++;
            if (currentPlayerIndex < playerNames.length) {
                setupTurnPlayer();
            } else {
                showFinalResults();
            }
        }

        function playAudioBlob(blob, onEnd) {
            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);
            audio.play();
            if (onEnd) audio.onended = onEnd;
        }

        // Realistic Spectrum Comparison Logic (Pitch Peak + RMS Envelope)
        function calculateAudioSimilarity(target, player) {
            if (!target.length || !player.length) return Math.random() * 20 + 30;

            const samples = 30; // Resample both arrays to 30 time slots
            const normTarget = resampleArray(target, samples);
            const normPlayer = resampleArray(player, samples);

            let volumeDiffSum = 0;
            let pitchDiffSum = 0;

            for (let i = 0; i < samples; i++) {
                volumeDiffSum += Math.abs(normTarget[i].rms - normPlayer[i].rms);
                pitchDiffSum += Math.abs(normTarget[i].pitchBin - normPlayer[i].pitchBin);
            }

            // Calculate similarity score metrics
            const avgVolDiff = volumeDiffSum / samples;
            const avgPitchDiff = pitchDiffSum / samples;

            let volScore = Math.max(0, 100 - (avgVolDiff * 1.5));
            let pitchScore = Math.max(0, 100 - (avgPitchDiff * 4));

            let finalScore = (volScore * 0.4) + (pitchScore * 0.6);
            
            // Boundary constraints
            if (finalScore > 98.5) finalScore = 98.5 + (Math.random() * 1.4);
            if (finalScore < 15) finalScore = 10 + (Math.random() * 10);

            return finalScore;
        }

        function resampleArray(arr, targetLength) {
            const result = [];
            const step = arr.length / targetLength;
            for (let i = 0; i < targetLength; i++) {
                const idx = Math.min(Math.floor(i * step), arr.length - 1);
                result.push(arr[idx]);
            }
            return result;
        }

        // Smooth Visualizer + Realtime Audio Feature Sampling
        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            // Sample Audio features when recording
            if (isAnalysing) {
                let sumSquare = 0;
                let maxVal = 0;
                let maxBin = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const val = dataArray[i];
                    sumSquare += val * val;
                    if (val > maxVal) {
                        maxVal = val;
                        maxBin = i;
                    }
                }
                const rms = Math.sqrt(sumSquare / bufferLength);
                currentFeaturesTemp.push({ rms: rms, pitchBin: maxBin });
            }

            // Canvas Drawing
            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
            const barWidth = (canvas.width / bufferLength) * 2.5;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const barHeight = (dataArray[i] / 255) * canvas.height;

                const gradient = canvasCtx.createLinearGradient(0, canvas.height, 0, 0);
                gradient.addColorStop(0, '#6c5ce7');
                gradient.addColorStop(1, '#ff7675');

                canvasCtx.fillStyle = gradient;
                canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);

                x += barWidth + 2;
            }
        }

        // Show Final Podium Screen
        function showFinalResults() {
            elGame.classList.remove('active');
            elResult.classList.add('active');

            playerScores.sort((a, b) => b.score - a.score);

            const podiumContainer = document.getElementById('podium-wrapper');
            podiumContainer.innerHTML = '';

            const displayOrder = [1, 0, 2]; // Podium Visual Layout (2nd, 1st, 3rd)

            displayOrder.forEach((rankIdx) => {
                if (rankIdx < playerScores.length) {
                    const p = playerScores[rankIdx];
                    const rankNum = rankIdx + 1;

                    const podiumCard = document.createElement('div');
                    podiumCard.className = `podium-card podium-${rankNum}`;
                    podiumCard.innerHTML = `
                        <div class="podium-rank">${rankNum}</div>
                        <div class="podium-name">${p.name}</div>
                        <div class="podium-score">${p.score.toFixed(1)}%</div>
                    `;
                    podiumContainer.appendChild(podiumCard);
                }
            });
        }
    </script>
</body>
</html>
